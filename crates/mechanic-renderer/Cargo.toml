[package]
name = "mechanic-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wgpu.workspace = true
cosmic-text.workspace = true
swash = "0.2"
unicode-script = "0.5"
unicode-bidi = "0.3"
log.workspace = true
mechanic-config.workspace = true
bytemuck = { version = "1", features = ["derive"] }
bitflags = "2"
raw-window-handle = "0.6"
pollster.workspace = true

# The logo needs only SVG shapes.
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
winit.workspace = true
unicode-width = "0.2"
# Shader validation.
naga = { version = "30", features = ["wgsl-in"] }
