<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="nucleus">
      <stop offset="0" stop-color="#E0FFFF" stop-opacity="0.7"/>
      <stop offset="0.3" stop-color="#52E8FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#52E8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="38%" cy="32%" r="68%">
      <stop offset="0" stop-color="#F0FFFF"/>
      <stop offset="0.25" stop-color="#ADFFFF"/>
      <stop offset="0.6" stop-color="#42BCD2"/>
      <stop offset="1" stop-color="#103B58"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="90" x2="0" y2="166" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20576B"/>
      <stop offset="0.5" stop-color="#4298AC"/>
