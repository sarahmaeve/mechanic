[workspace]
resolver = "2"
members = [
    "crates/mechanic-app",
    "crates/mechanic-core",
    "crates/mechanic-renderer",
    "crates/mechanic-config",
    "crates/mechanic-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
# Terminal emulation
alacritty_terminal = "0.26"

# GPU rendering
wgpu = "30"

# Windowing
winit = "0.30"

# Text shaping and layout
cosmic-text = "0.19"

# Serialization / configuration
serde = { version = "1", features = ["derive"] }
toml = "1.1"

# Concurrency
crossbeam-channel = "0.5"

# Async executor (used to drive wgpu init on the main thread)
pollster = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# System
libc = "0.2"

# Clipboard
arboard = "3"

# Internal crates
mechanic-core = { path = "crates/mechanic-core" }
mechanic-renderer = { path = "crates/mechanic-renderer" }
mechanic-config = { path = "crates/mechanic-config" }

[patch.crates-io]
vte = { path = "vendor/vte" }
alacritty_terminal = { path = "vendor/alacritty_terminal" }
